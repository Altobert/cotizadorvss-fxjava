# Configuración de Base de Datos - Sistema Cotización VSS
# =======================================================

# Configuración de PostgreSQL
#db.url=jdbc:postgresql://localhost:5432/sistema_cotizacion_2025
db.url=jdbc:postgresql://localhost:5432/sistema_cotizacion
db.host=localhost
db.port=5432
db.database=sistema_cotizacion_2025
db.username=albertosanmartin
db.password=

# Configuración de conexión
db.driver=org.postgresql.Driver
db.schema=public
db.connection.timeout=30000
db.socket.timeout=60000
db.ssl.enabled=false

# Pool de conexiones (opcional)
db.pool.enabled=false
db.pool.min.size=2
db.pool.max.size=10
db.pool.max.wait=30000

# Configuración de entorno
app.environment=development
app.debug=true

# Configuración de logging
db.log.enabled=true
db.log.level=INFO