# Configuración de Logging para Sistema Cotización VSS
# ===================================================

# Configuración del logger raíz
.level = INFO
.handlers = java.util.logging.ConsoleHandler, java.util.logging.FileHandler

# Configuración del ConsoleHandler
java.util.logging.ConsoleHandler.level = INFO
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter

# Configuración del FileHandler
java.util.logging.FileHandler.level = ALL
java.util.logging.FileHandler.pattern = cotizador-%g.log
java.util.logging.FileHandler.limit = 1048576
java.util.logging.FileHandler.count = 5
java.util.logging.FileHandler.append = true
java.util.logging.FileHandler.formatter = java.util.logging.SimpleFormatter

# Configuración específica para nuestros paquetes
cl.vss.cotizador.level = FINE
cl.vss.cotizador.service.level = INFO
cl.vss.cotizador.service.CotizacionService.level = INFO

# Configuración del formato de fecha
java.util.logging.SimpleFormatter.format = %1$tY-%1$tm-%1$td %1$tH:%1$tM:%1$tS [%4$s] %3$s: %5$s%6$s%n

# Configuración para bibliotecas externas (reducir ruido)
org.apache.poi.level = WARNING
org.postgresql.level = WARNING